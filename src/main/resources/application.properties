spring.application.name=demo

# Cloud Run (like most platforms) assigns the port and injects it as PORT; a container
# listening anywhere else starts, receives nothing, and is marked failed. 8080 locally.
server.port=${PORT:8080}

# Set SUPABASE_DB_PASSWORD before running, in the shell or the IDE run config.
# Note: an unset variable is NOT reported as a missing placeholder - Spring passes
# the literal ${...} through and you get "password authentication failed", which
# looks like a wrong password rather than a missing env var.
spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.tmsequiejrnxqfswicpl
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase's pooler drops idle connections, and Hikari cannot tell a dead one from an
# idle one - it hands it out and every query fails with "This connection has been
# closed" until the pool turns over. Seen after the laptop slept: 9 idle connections,
# all dead, requests timing out at 90s. keepalive-time pings them so the pool notices
# first; max-lifetime retires them well under the server's own idle cutoff.
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.validation-timeout=3000

# Hikari's default is 10 per instance. This is Supabase's session pooler, which hands each
# client a real Postgres connection out of a small shared allowance - so the pool size here,
# times however many instances the host scales to, is what has to fit inside it. 5 is ample
# for the request rate and leaves room for psql and the ml/ scripts alongside.
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=validate
# Useful at a terminal, noise in a hosted log: every query of every request, written to a
# log that is metered by volume. Set JPA_SHOW_SQL=false wherever this is deployed.
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# HS256 needs at least 32 bytes; a shorter value fails at startup with
# WeakKeyException from Keys.hmacShaKeyFor - that one IS a clear message.
jwt.secret=${JWT_SECRET}
jwt.expiry-minutes=120

# Which model does the reranking. "ollama" (default) is the local daemon and what
# development runs on; "gemini" is the hosted API, for deployments that cannot host a 14B
# model next to the app. ProductReranker has one implementation per value, each gated by
# @ConditionalOnProperty - exactly how webhook.provider picks an SMS sender below.
reranker.provider=${RERANKER_PROVIDER:ollama}

# Ollama runs as a local daemon, so base-url is machine-local: this only resolves
# while the job runs on the same host as ollama serve. The read timeout is generous
# because a 14B model can take tens of seconds - acceptable only for the batch job.
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen2.5:14b}
ollama.connect-timeout=5s
ollama.read-timeout=120s

# Gemini, used only when reranker.provider=gemini - GeminiConfig is conditional, so an
# Ollama run needs no key. The key is sent as the x-goog-api-key header rather than the
# ?key= query parameter the REST docs show: both authenticate the same, but a credential
# in a URL ends up in access logs, proxy logs and error text.
#
# Free tier is roughly 15 requests/minute and 1,500/day on 2.5-flash. The consumer is
# single-threaded (prefetch=1), so only one rerank is ever in flight and the per-minute
# limit is hard to reach; a 429 would surface as "gemini rerank failed" in the log and a
# silent drop back to candidate order.
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.connect-timeout=5s
gemini.read-timeout=30s

# Embed microservice (ml/embed_service.py) - turns search-box text into a 384-d
# vector. Java cannot run BGE itself, so this hop exists purely because the
# embedding model is Python. Tight timeout: one forward pass on a small model.
embed.base-url=${EMBED_BASE_URL:http://localhost:8001}
embed.api-key=${EMBED_API_KEY:}

# The embed service is hosted separately and scales to zero when idle, so the first search
# after a quiet spell pays a cold start while a new instance loads the model. 10s was right
# when the service ran beside the app; 60s gives a waking instance a chance to answer, and
# is a ceiling rather than an expectation - a warm call returns in milliseconds. Nothing waits
# forever: past this SearchService drops to lexical-only rather than failing the search.
embed.connect-timeout=5s
embed.read-timeout=60s

# Redis backs both caches - reco:user:{id} (RecommendationCacheService) and
# search:q:{query} (SearchCacheService). Defaults are a bare local daemon; a hosted
# instance needs the username/password/ssl trio, which is why they are env vars and
# not literals. Timeouts are deliberately short: every call fails open, so an
# unreachable Redis must cost 2s, not Lettuce's 60s.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# Pool behind RecommendationService.warm. One thread on purpose: a warm is a 14B model
# call, and a second concurrent one would contend with the first on the same Ollama
# rather than finish sooner. The queue is bounded so a burst of searches cannot pile up
# work that outlives the searches which asked for it.
spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=1
spring.task.execution.pool.queue-capacity=10

# Webhook job: polls last_search for rows old enough to notify on. delay-minutes is
# measured from searched_at, not from JWT expiry - see SearchService/CandidateRepository.
# poll-interval is in ms (Spring's fixedDelayString).
webhook.delay-minutes=15
webhook.poll-interval=60000
webhook.limit=5

# "stub" (default) logs what would be sent - see SmsWebhookSender. Set to "twilio" to
# actually send, via TwilioWebhookSender - every due user then gets a real SMS, so
# flip this only once a from-number and (in trial mode) verified caller IDs are set
# up in the Twilio console.
webhook.provider=stub
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.from-number=${TWILIO_FROM_NUMBER}

# Rate limiting - RateLimitFilter runs ahead of the DispatcherServlet, so a request over
# the limit never reaches RRF, pgvector or Ollama. Counters are fixed-window keys in the
# same Redis the caches use ("rate-limit:{endpoint}:{userId}" or ":ip:{addr}"), and every
# check fails open: an unreachable Redis allows the request rather than blocking it.
#
# Identity is the JWT subject when the caller sends a Bearer token, the client address
# otherwise - so an unauthenticated burst is capped per IP.
ratelimit.enabled=true

# X-Forwarded-For is client-settable, so believe it only behind a proxy that appends the
# address it actually saw - RateLimitFilter reads that last entry, never the caller's own.
# Left false, every request behind a proxy shares the proxy's address as one bucket, which
# on a hosted deployment means the auth limit below is shared by every visitor at once.
# Set RATELIMIT_TRUST_FORWARDED_HEADER=true there; false is right for a direct local run.
ratelimit.trust-forwarded-header=${RATELIMIT_TRUST_FORWARDED_HEADER:false}

# A search miss costs an embed hop plus RRF, and each authenticated search also queues an
# Ollama warm - 30/min is generous for a person typing and still bounds that queue.
ratelimit.buckets.search.limit=30
ratelimit.buckets.search.window=1m

# A cold read here is a 14B model call, tens of seconds of it.
ratelimit.buckets.recommendations.limit=10
ratelimit.buckets.recommendations.window=1m

# Password guessing, not throughput: keyed by IP, covering both /api/auth/login and
# /api/auth/signup. There is no OTP endpoint in this project - this is its equivalent.
ratelimit.buckets.auth.limit=5
ratelimit.buckets.auth.window=10m

# RabbitMQ - carries the recommendation job a search raises. The producer publishes to
# recommendation.exchange with routing key "recommendation.rerank"; the binding in
# RabbitMQConfig drops it into the durable recommendation.queue, where RabbitMQConsumer
# picks it up and calls RecommendationService. A message that fails every attempt is
# dead-lettered to recommendation.dlq rather than discarded.
# Defaults are a local broker; credentials come from the environment so none are in here.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# A hosted broker is reached over the public internet, so the login must not travel in
# clear text: set RABBITMQ_SSL=true and RABBITMQ_PORT=5671 (AMQPS) there. Off by default
# because a local broker speaks plain AMQP on 5672.
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}

# Reject rather than requeue. Spring AMQP's default returns a failed message to the queue,
# which is an infinite redelivery loop. Rejecting is not a silent drop any more: the queue
# carries x-dead-letter-exchange, so the broker republishes the rejected message to
# recommendation.dlx and it lands in recommendation.dlq for inspection. The job itself is
# only a cache warm, so even a permanently failed one costs nothing beyond a slower first
# read - RecommendationController recomputes on demand.
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Three in-process attempts first, so a transient blip is not a lost job. Bounded, so a
# genuine outage gives up instead of retrying forever.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s

# One rerank at a time. The 14B model is the bottleneck and a second concurrent call would
# contend with the first on the same Ollama rather than finish sooner - the same reasoning
# as the task executor sizing above.
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1

# Dead-letter monitoring. recommendation.dlq has no consumer on purpose, so nothing would
# otherwise reveal that jobs are failing - DeadLetterMonitor polls its depth and logs a
# WARN while it is non-empty. check-interval is in ms (Spring's fixedDelayString), matching
# webhook.poll-interval above.
#
# Threshold 1 means "warn whenever anything is in there", which suits this app's volume:
# a single dead-lettered job is worth seeing. Raise it if that ever becomes noisy.
rabbitmq.dlq.check-interval=300000
rabbitmq.dlq.warn-threshold=1

# The depth is also published as the Micrometer gauge recommendation.dlq.depth. Actuator's
# metrics endpoint is deliberately NOT exposed over HTTP: this application has no
# authentication filter (see SecurityBeans) and RateLimitFilter does not cover /actuator/*,
# so exposing it would publish internal detail to anyone. Add
# management.endpoints.web.exposure.include=health,metrics once there is auth in front.

# Adds /actuator/health/liveness and /readiness. The platform's health probe must use
# liveness, NOT plain /actuator/health: that one aggregates Redis, RabbitMQ and the
# database, so it turns red when any of them is down - and a probe pointed at it would
# restart an application that is deliberately still serving without them.
management.endpoint.health.probes.enabled=true

# DLQ alerting. Posts to an incoming-webhook URL (Slack, Discord, Teams, or any endpoint
# accepting a JSON POST) when the dead-letter queue crosses the threshold above, and once
# more when it clears.
#
# Blank by default, which disables it entirely - nothing is sent and nothing can fail. The
# URL is a credential: anyone holding it can post into the channel, so it comes from the
# environment and is never written here or logged.
alert.webhook-url=${ALERT_WEBHOOK_URL:}

# One alert on the first crossing, then at most one per hour while the backlog persists.
# Without this the check would notify on every poll - about twelve times an hour - which is
# how an alert channel gets muted and stops being read at all.
alert.cooldown=1h
alert.connect-timeout=3s
alert.read-timeout=5s
